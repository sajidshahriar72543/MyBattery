name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBattery-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: MyBattery-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk

  release:
    # Only run when a v* tag is pushed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to create a release
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: MyBattery-debug-apk
          path: apks/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: MyBattery-release-apk-unsigned
          path: apks/release

      - name: Rename APKs with tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DEBUG_APK=$(find apks/debug  -name '*.apk' | head -n1)
          REL_APK=$(find apks/release -name '*.apk' | head -n1)
          cp "$DEBUG_APK" "MyBattery-${TAG}-debug.apk"
          cp "$REL_APK"   "MyBattery-${TAG}-release-unsigned.apk"
          ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MyBattery ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            MyBattery-${{ github.ref_name }}-debug.apk
            MyBattery-${{ github.ref_name }}-release-unsigned.apk