name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine version and release tag
        id: version
        run: |
          set -euo pipefail
          # Read versionName from app/build.gradle.kts (e.g. "2.0.4")
          VERSION_NAME=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts)
          VERSION_NAME=${VERSION_NAME:-0.0.0}

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"                        # use the pushed tag verbatim
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            TAG=""                                          # no release from PRs
          else
            TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}" # auto-generated
          fi

          echo "value=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"            >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME}"
          echo "Tag:     ${TAG}"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBattery-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: MyBattery-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk

  release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to create the tag + release
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: MyBattery-debug-apk
          path: apks/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: MyBattery-release-apk-unsigned
          path: apks/release

      - name: Rename APKs with tag
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          DEBUG_APK=$(find apks/debug  -name '*.apk' | head -n1)
          REL_APK=$(find apks/release -name '*.apk' | head -n1)
          cp "$DEBUG_APK" "MyBattery-${TAG}-debug.apk"
          cp "$REL_APK"   "MyBattery-${TAG}-release-unsigned.apk"
          ls -lh *.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MyBattery ${{ needs.build.outputs.release_tag }}
          tag_name: ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          files: |
            MyBattery-${{ needs.build.outputs.release_tag }}-debug.apk
            MyBattery-${{ needs.build.outputs.release_tag }}-release-unsigned.apk